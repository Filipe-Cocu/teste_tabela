<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabelaWeb</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  

  <div class="container">
    <h1>Tabela de Produtos Ferroplast</h1>
    <div class="row valign-wrapper" style="margin-bottom: 20px;">
  <div class="input-field col s12 m8 l6">
    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="🔍 Procurar..." class="validate">
  </div>
<div class="col s12 m4 l6 right-align">
  <button class="btn waves-effect blue" onclick="aplicarAjustes()">Aplicar</button>
  <button class="btn grey lighten-1 black-text" onclick="resetAjustes()" style="margin-left: 10px;">Limpar</button>
</div>

</div>
    <div id="filtros-preco" class="row">
      <div class="input-field col s6 m3">
        <input type="number" id="ajusteFerroplast" placeholder="Desconto">
        <label for="ajuste2022">Ferroplast</label>
    </div>
    <div class="input-field col s6 m3">
      <input type="number" id="ajusteFersil" placeholder="Desconto">
      <label for="ajusteFersi">Fersil</label>
    </div>
    <div class="input-field col s6 m3">
      <input type="number" id="ajustePolitejo" placeholder="Desconto">
      <label for="ajustePolitejo">Politejo</label>
    </div>
    <div class="input-field col s6 m3">
      <input type="number" id="ajusteSival" placeholder="Desconto">
      <label for="ajusteSival">Sival</label>
    </div>    
  </div>
    <div class="table-wrapper">  
      <table id="articlesTable" class="striped highlight centered">
        <thead>
          <tr>
          <th>Código</th>
          <th>Família</th>
          <th>Descrição</th>
          <th>UN/CX - MTS</th>
          <th>Espessura (mm)</th>
          <th>Preço 2022</th>
          <th>Preço Fersil</th>
          <th>Preço Politejo</th>
          <th>Preço Sival</th>
          <th>Kg/mt ou Kg/un</th>
        </tr>
      </thead>
      <tbody><tr><td colspan="10">A carregar...</td></tr></tbody>
    </table>
  </div>
</div>
  <!-- Scripts -->  
  <script src="script.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
